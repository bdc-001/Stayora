[project]
name = "stayora-itinerary-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135.3,<0.137",
  "uvicorn[standard]>=0.43.0",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.14.2",
  "pydantic-ai-slim[openai]>=1.80.0",
]
[dependency-groups]
dev = ["pytest>=9.0.0", "httpx>=0.28.0", "ruff>=0.15.0"]
[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
pythonpath = ["."]
